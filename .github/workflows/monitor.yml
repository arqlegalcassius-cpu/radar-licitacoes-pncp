name: Monitor de licitações PNCP

on:
  schedule:
    # 11:00 e 20:00 UTC = 08:00 e 17:00 no horário de Brasília (UTC-3)
    - cron: "0 11,20 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write   # necessário para o job commitar seen.json e docs/data.json

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o monitor
        env:
          UFS: ${{ vars.UFS }}                       # ex: "" (todas) ou "SP,RJ,MG"
          MODALIDADES: ${{ vars.MODALIDADES }}        # ex: "4,5,8"
          DIAS_RETROATIVOS: ${{ vars.DIAS_RETROATIVOS }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor_pncp.py

      - name: Salvar histórico (data/seen.json e docs/data.json)
        run: |
          git config user.name "pncp-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json data/debug.json docs/data.json
          git diff --cached --quiet || git commit -m "chore: atualiza radar de licitações [skip ci]"
          git push
